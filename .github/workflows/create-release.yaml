name: Create GH release
on:
    push:
        tags:
            - 'v*'

jobs:
    create_release:
        runs-on: ubuntu-24.04
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Create release
              uses: ncipollo/release-action@v1
              with:
                generateReleaseNotes: true
                skipIfReleaseExists: true